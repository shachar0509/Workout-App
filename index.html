<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יומן אימונים"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>יומן אימונים</title>
<style>html,body{background:#08090b;margin:0}</style></head><body>
<script>
(function(){
  var K='wl-app-html';
  function run(h){document.open();document.write(h);document.close();}
  fetch('app.html?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.text();
  }).then(function(h){
    try{localStorage.setItem(K,h);}catch(e){}
    run(h);
  }).catch(function(){
    var h=null; try{h=localStorage.getItem(K);}catch(e){}
    if(h) run(h); else document.body.textContent='Offline';
  });
})();
</script></body></html>
